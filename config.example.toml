hotkey = "Ctrl+Alt+Space"
language = "pt"
model_path = "/home/USER/.local/share/linux-voice-typer/whisper.cpp/models/ggml-small.bin"
whisper_bin = "/home/USER/.local/share/linux-voice-typer/whisper.cpp/build/bin/whisper-cli"
insert_mode = "clipboard"

# paste_backend:
# - "auto": tenta wtype, depois ydotool, depois uinput, depois mantem so no clipboard
# - "wtype": usa wtype
# - "ydotool": usa ydotool
# - "uinput": usa /dev/uinput diretamente pelo app
# - "libei": usa o portal XDG RemoteDesktop (consentimento na primeira vez)
# - "none": copia para o clipboard e nao cola automaticamente
#
# Valor padrao gerado pelo setup: "auto".
# Recomendacao: use "uinput" quando wtype falhar no Wayland e /dev/uinput estiver acessivel.
# O mais importante e garantir que a transcricao fique no clipboard.
paste_backend = "auto"

# paste_shortcut:
# - "ctrl_v": recomendado para apps normais
# - "ctrl_shift_v": recomendado para muitos terminais Linux
paste_shortcut = "ctrl_v"

# restore_clipboard:
# - true: restaura o clipboard anterior DEPOIS que o auto-paste confirmar sucesso
# - false: mantem a transcricao no clipboard (recomendado)
#
# Com restore_clipboard = true, se o auto-paste falhar, a transcricao
# permanece no clipboard (nao e restaurada).
restore_clipboard = false
auto_paste = true
trim_text = true
temp_dir = "/home/USER/.local/share/linux-voice-typer/temp"

# auto_start_service: inicia o servico de voz ao abrir a interface desktop.
auto_start_service = true

# start_minimized: inicia com a janela oculta na bandeja (quando ha tray).
start_minimized = false

# start_with_system: cria/remove entrada de autostart em ~/.config/autostart.
start_with_system = false

# close_to_tray: ao fechar a janela, esconde para a bandeja (se houver tray).
# false: fechar a janela encerra o aplicativo.
# Sem host StatusNotifier detectado (ex.: GNOME sem extensao AppIndicator),
# fechar a janela encerra o app mesmo com close_to_tray = true.
close_to_tray = true

# osd_enabled: exibe notificacoes de desktop (gravacao, transcricao, erros e
# inicio/parada do servico). false desativa todo o OSD.
osd_enabled = true

# input_device: nome do microfone de entrada (veja a lista na aba
# Configuracoes da interface). Se omitido, usa o padrao do sistema.
# input_device = "Nome do microfone"

# overlay_enabled: mostra uma janelinha na tela durante gravacao/transcricao
# (estado, cronometro e waveform), substituindo as notificacoes persistentes
# de "gravando"/"transcrevendo". Arraste o overlay para reposicionar.
overlay_enabled = true

# Posicao salva do overlay em pixels fisicos (omitidas = canto superior direito).
# overlay_x = 1200
# overlay_y = 24
