[package]
name = "linux-voice-typer"
version = "0.1.0"
edition = "2024"

[dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "remote_desktop", "screencast"] }
clap = { version = "4.5", features = ["derive"] }
cpal = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = "3.5"
dialoguer = "0.11"
dirs = "5"
enumflags2 = "0.7"
env_logger = "0.11"
futures-executor = "0.3"
hound = "3.5"
keytap = { version = "0.4", features = ["chord"] }
libc = "0.2"
log = "0.4"
reis = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
which = "6"
